name: Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
    branches: [main, master]
  push:
    paths:
      - "src/**"
      - "tests/**"
    branches: [main, master]

jobs:
  tests:
    if: github.repository == 'raycast/utils'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: raycast/github-actions/git-checkout@v1.13.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Npm Install
        run: npm ci
      - name: Npm Lint
        run: npm run test
      - name: Build
        run: npm run build
      - name: Unit Tests
        run: npm run test:unit
      # The Raycast CLI's `ray build` does not run on Windows, so Windows coverage
      # stops at the unit tests above; the example extension builds on Linux and macOS.
      - name: Npm Install Tests
        if: runner.os != 'Windows'
        run: npm ci
        working-directory: ./tests
      - name: Build tests
        if: runner.os != 'Windows'
        run: npm run build
        working-directory: ./tests
